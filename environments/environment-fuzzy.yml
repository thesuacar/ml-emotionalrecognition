#environment requirements for running TASK 4 - Fuzzy systems

#to initialize the environment, run the following command in your terminal:
  #conda env create -f environments/environment-fuzzy.yml

#to activate the environment, run:
  #conda activate emotion_fuzzy

name: emotion_fuzzy
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=1.24.4
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - opencv
  - dlib
  - ipykernel
  - jupyterlab
  - pillow
  - pip
  - pip:
      - pyfume==0.3.4